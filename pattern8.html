<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern</title>
</head>
<body>
    <script>
        <!DOCTYPE html>
<html lang="en">
<head>
    let n = 5;

for (let i = 1; i <= n; i++) {
    console.log(" ".repeat(n-i) + "*".repeat(i));
}

for (let i = n-1; i >= 1; i--) {
    console.log(" ".repeat(n-i) + "*".repeat(i));
}
    </script>
</body>
</html>
